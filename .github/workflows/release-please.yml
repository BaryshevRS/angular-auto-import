# Version, changelog, and both marketplaces, from conventional commits.
#
# Two jobs, and the second one almost never runs. release-please watches main and keeps a
# release pull request open, rewriting the version and the changelog from the commits that
# have landed since the last release. Nothing is published while that PR sits there.
# Merging it is the release: release-please then tags, cuts the GitHub release, and only
# then does `publish` have something to do.
#
# The gate runs here rather than being inherited from CI. A tag is not a second opinion —
# release-please cuts it from whatever is on main, so the archive about to reach two
# registries is checked on its own terms, including `vsce:inspect` on the exact file that
# gets uploaded. The E2E suites are still absent for the reason ci.yml gives: they need an
# editor, a display, and fixture dependencies this repository does not track. Run
# `pnpm run test:e2e:v22:parallel` locally before merging the release PR.
#
# Both registries authenticate with a stored token, because as of September 2026 neither
# accepts anything better yet. Both publishing CLIs already carry the flags for trusted
# publishing, which is what makes this look out of date on a first read — they ship ahead
# of the servers they talk to:
#
#   Open VSX  - the registry gained it in openvsx v1.2.0, released 10 September 2026;
#               open-vsx.org still runs v1.1.2, so there is no policy to register yet.
#               Watch `curl https://open-vsx.org/api/version`. Once it reports 1.2.0 or
#               later, register a publisher at /user-settings/trusted-publishers for this
#               repository and this workflow file, drop OVSX_PAT, add `id-token: write`,
#               and pass `--trusted-publishing`.
#   Marketplace - unreleased (microsoft/vscode-vsce#1275). It also rejects the
#               organization-scoped tokens that would have outlived the global ones
#               (microsoft/vsmarketplace#2121), so VSCE_PAT has to be a global Azure
#               DevOps PAT — exactly the kind retired on 1 December 2026. That date is a
#               hard deadline for this workflow: something has to replace this secret
#               before it, and `vsce publish --oidc` is what it will be.
name: Release

on:
  push:
    branches: [main]
  # Releases are otherwise only reachable by pushing to main, which is the wrong tool
  # when the last run needs repeating — a failed publish, or a release-please pass that
  # ran before a missing tag was in place.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Releases must not overlap, and a queued one must not be thrown away: cancelling here
# would abandon a run that had already published to one registry and not the other.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the VSIX to the release release-please just cut
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check`, not `check:fix`: a release reports formatting, it does not rewrite it.
      - name: Formatting and lint
        run: pnpm run check

      - name: Types
        run: pnpm run check-types

      - name: Node test suites
        run: pnpm run test:node

      - name: Package
        run: pnpm run vsce:package

      # On the archive itself, not the source tree: both bundles present, and nothing the
      # server would have to resolve at runtime.
      - name: Inspect the VSIX
        run: pnpm run vsce:inspect

      - name: Resolve the packaged file
        id: vsix
        run: echo "path=$(ls angular-auto-import-*.vsix)" >> "$GITHUB_OUTPUT"

      # `--skip-duplicate` on both, so re-running a run that failed halfway through
      # republishes the registry that missed out and leaves the other one alone.
      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach the VSIX to the release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.vsix.outputs.path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
